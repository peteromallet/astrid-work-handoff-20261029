id: structure.remove-line.music-keep-end
source: W2 (new)
intent: Remove narration line s1 ("It went viral.") from a film whose music runs to its end; the default keep_end cuts the bed at the removal, so its ending stays on the film's end.
fixture: tiny-bed8  # under keep_end the bed already runs to the film's 8 s end (e766a7d8), so no setup step
expect: change
cli:
  - edit --remove-line s1
sheet:
  replace:
    - ['  s1  "It went viral."', '']
python: |
  tl.remove_line("s1")
check:
  - '"s1" not in [v.segment for v in tl.lines()]'
  - 'len([c for c in tl.clips() if c.track == "music"]) == 2'
  - 'abs(max(c.end for c in tl.clips() if c.track == "music") - tl.duration) < 1/30'
