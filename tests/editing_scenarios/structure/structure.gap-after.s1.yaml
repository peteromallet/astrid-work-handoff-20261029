id: structure.gap-after.s1
source: h1 T7
intent: Make the pause after narration line s1 0.8 s; everything after it moves and no layer is lost.
fixture: tiny
expect: change
cli: edit --gap-after s1=0.8
sheet:
  cuts: [c1]
  replace:
    - ['s1  "It went viral."', 's1  "It went viral."  gap 0.8']
python: |
  tl.voice("s1").set_gap_after(0.8)
check:
  - abs(tl.voice("s1").gap_after - 0.8) < 1e-6
  - abs(tl.time('"Live"') - 2.6) < 1e-3
  - len(tl.clips(text="Live.")) == 1
