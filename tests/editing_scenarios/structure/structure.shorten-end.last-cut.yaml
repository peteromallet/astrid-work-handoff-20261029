id: structure.shorten-end.last-cut
source: new (Round 0 L7-01, the length of the film must follow its content in both directions)
intent: Shorten the last cut's picture by 1 s; the film and the last shot's placement become 7.0 s and 3000 ms.
fixture: tiny
expect: change
cli: edit --clip c2.plate --extend -1.0
sheet:
  cuts: [c2]
  replace:
    - ['plate  plate  snap-plate  Q', 'plate  plate  snap-plate  Q  for 3s']
python: |
  tl.clip("c2.plate").extend(-1.0)
check:
  - abs(tl.duration - 7.0) < 1e-6
  - "[p for p in tl.document()['placements'] if p['shot_id'] == 'B'][0]['duration_ms'] == 3000"
