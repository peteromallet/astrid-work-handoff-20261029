id: structure.cut-on.c3-four
source: h1 T5
intent: Start cut c3 on the spoken word "four" (its picture moves to 9.0 s, and c2's picture runs on to meet it).
fixture: tiny3
expect: change
cli: edit --cut c3 --on '"four"'
sheet:
  cuts: [c3]
  replace:
    - ['┃ c3    on "three"', '┃ c3    on "four"']
python: |
  tl.clip("c3.plate").on('"four"')
check:
  - abs(tl.clip("c3.plate").start - 9.0) < 1e-3
  - abs(tl.clip("c2.plate").end - 9.0) < 1e-3
