id: structure.cut-on.c2-now
source: h1 T5
intent: Ask for cut c2 to start on the spoken word "now" when c2 opens its chapter, so the moment is stored, and the picture stays at the chapter start (4.0 s), because moving it would leave a hole there. A cut inside a chapter does move (structure.cut-on.c3-four).
fixture: tiny
expect: change
cli: edit --cut c2 --on '"now"'
sheet:
  cuts: [c2]
  replace:
    - ['plate  plate  snap-plate  Q', 'plate  plate  snap-plate  Q  on "now"']
python: |
  tl.clip("c2.plate").on('"now"')
check:
  - abs(tl.clip("c2.plate").start - 4.0) < 1e-3
  - tl.clip("c2.plate").data["app"]["astrid"]["on"] == '"now"'
  - 'any("opens its chapter" in line for line in tl.check().problems)'
