id: structure.add-cut.now
source: h1 T4
intent: Add a cut on the spoken word "now" in c2 without changing the length of the film (c2 is split, not extended).
fixture: tiny
expect: change
cli: edit --add-cut --on '"now"'
sheet:
  cuts: [c2]
  replace:
    - ["         why: live", "         why: live\n  6.40 ┃ c2a on \"now\"\n         plate  plate  snap-plate  Q"]
python: |
  tl.add_cut('"now"')
check:
  - abs(tl.clip("c2a.plate").start - 6.4) < 1e-3
  - abs(tl.duration - 8.0) < 1e-6
