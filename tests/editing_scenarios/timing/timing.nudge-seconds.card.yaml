id: timing.nudge-seconds.card
source: h1 T3
intent: Move the c2 "Live." card 0.1 s later (it starts at 4.0 s, so 4.1 s).
fixture: tiny
expect: change
cli: edit --clip c2.card --nudge 0.1
sheet:
  cuts: [c2]
  replace:
    - ['for 1s', 'on +0.1s for 1s']
python: |
  tl.clip("c2.card").nudge(0.1)
check:
  - abs(tl.clip("c2.card").start - 4.1) < 1e-6
