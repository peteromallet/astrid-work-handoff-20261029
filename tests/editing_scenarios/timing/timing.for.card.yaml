id: timing.for.card
source: h1 T2
intent: Hold the c2 "Live." card for 1.5 s.
fixture: tiny
expect: change
idempotent: true
cli: edit --clip c2.card --for 1.5
sheet:
  cuts: [c2]
  replace:
    - ['for 1s', 'for 1.5s']
python: |
  tl.clip("c2.card").hold_for(1.5)
check:
  - abs(tl.clip("c2.card").duration - 1.5) < 1e-6
