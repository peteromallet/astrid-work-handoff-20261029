id: timing.until.card-now
source: h1 T2
intent: Hold the c2 "Live." card until the spoken word "now".
fixture: tiny
expect: change
cli: edit --clip c2.card --until '"now"'
sheet:
  cuts: [c2]
  replace:
    - ['for 1s', 'until "now"']
python: |
  tl.clip("c2.card").until('"now"')
check:
  - abs(tl.clip("c2.card").end - tl.time('"now"')) < 1e-3
