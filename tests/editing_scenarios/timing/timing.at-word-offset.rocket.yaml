id: timing.at-word-offset.rocket
source: h1 T1
intent: Start the c1 rocket 0.2 s after the spoken word "went".
fixture: tiny
expect: change
cli: edit --clip c1.rocket --at-word went --offset 0.2
sheet:
  cuts: [c1]
  replace:
    - ['on "viral"', 'on "went" +0.2s']
python: |
  tl.clip("c1.rocket").enter_at("went", offset=0.2)
check:
  - abs(tl.clip("c1.rocket").start - 1.1) < 1e-3
