id: timing.nudge-frames.rocket
source: h1 T3
intent: Move the c1 rocket 3 frames earlier, keeping its word "viral".
fixture: tiny
expect: change
cli: edit --clip c1.rocket --nudge-frames -3
sheet:
  cuts: [c1]
  replace:
    - ['on "viral"', 'on "viral" -3f']
python: |
  tl.clip("c1.rocket").nudge(0, frames=-3)
check:
  - abs(tl.clip("c1.rocket").start - 1.2) < 1e-6
  - tl.clip("c1.rocket").anchor.startswith('"viral"')
