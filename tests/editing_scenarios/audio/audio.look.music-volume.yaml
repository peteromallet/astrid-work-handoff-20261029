id: audio.look.music-volume
source: M-4 (clip.look)
intent: Set the music bed a-music to volume 0.5 through the look path (the clip-level field, on all three paths).
fixture: tiny
expect: change
cli: edit --clip a-music --volume 0.5
sheet:
  cuts: [c1]
  replace:
    - ["Q  for 4s", "Q  for 4s volume=0.5"]
python: |
  tl.clip("a-music").look.set(volume=0.5)
check:
  - abs(tl.clip("a-music").look["volume"] - 0.5) < 1e-6
