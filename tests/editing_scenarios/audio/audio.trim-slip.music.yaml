id: audio.trim-slip.music
source: new
intent: Trim a music source range and slip it without moving its film position.
fixture: audio-media
expect: change
cli: edit --clip a-music --trim-in 1 --trim-out 3 --slip 2
sheet:
  replace:
    - ['for 8s  trim=0..8', 'for 2s  trim=3..5']
python: |
  tl.clip("a-music").trim(in_s=1, out_s=3).slip(2)
check:
  - tl.clip("a-music").data["from"] == 3
  - tl.clip("a-music").data["to"] == 5
  - abs(tl.clip("a-music").start) < 1e-6
  - abs(tl.clip("a-music").duration - 2) < 1e-6
