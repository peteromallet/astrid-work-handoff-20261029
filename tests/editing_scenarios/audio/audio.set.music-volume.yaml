id: audio.set.music-volume
source: h3 A1/A7
intent: Set the music bed a-music to volume 0.5 (a flat level under the film).
fixture: tiny
expect: change
cli: edit --clip a-music --set volume=0.5
sheet:
  cuts: [c1]
  replace:
    - ["Q  for 4s", "Q  for 4s volume=0.5"]
python: |
  tl.clip("a-music").set(volume=0.5)
check:
  - abs(tl.clip("a-music").look["volume"] - 0.5) < 1e-6
