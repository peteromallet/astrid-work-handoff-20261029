id: look.set.plate-zoom-focus
source: h2 L11
intent: Zoom the c1 plate 2x with the focus on the right half of the frame (x=0.75, y=0.5) (am-snap-plate zoom is an integer 1–3 by its element.yaml; a fractional zoom is refused, see look.set.plate-zoom-fraction).
fixture: tiny
expect: change
cli: edit --clip c1.plate --set zoom=2 --set 'focus={"x":0.75,"y":0.5}'
sheet:
  cuts: [c1]
  replace:
    - ["snap-plate  P", 'snap-plate  P zoom=2 focus={"x":0.75,"y":0.5}']
python: |
  tl.clip("c1.plate").set(zoom=2, focus={"x": 0.75, "y": 0.5})
check:
  - tl.clip("c1.plate").get("zoom") == 2
  - tl.clip("c1.plate").get("focus")["x"] == 0.75
