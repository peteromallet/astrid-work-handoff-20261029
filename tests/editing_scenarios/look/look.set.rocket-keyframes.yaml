id: look.set.rocket-keyframes
source: h2 L10 (keyframed move)
intent: Move the c1 rocket from x=1000 to x=1400 (canvas px) over 1 s (30 fps) with keyframes. A sprite sits on a 6-px grid (stored x/6), so 1400 reads back as 1398.
fixture: tiny
expect: change
cli: edit --clip c1.rocket --set 'keyframes=[{"frame":0,"x":1000,"y":300},{"frame":30,"x":1400,"y":300}]'
sheet:
  cuts: [c1]
  replace:
    - ["x=60", "x=60 keyframes=[{\"frame\":0,\"x\":1000,\"y\":300},{\"frame\":30,\"x\":1400,\"y\":300}]"]
python: |
  tl.clip("c1.rocket").set(keyframes=[{"frame": 0, "x": 1000, "y": 300}, {"frame": 30, "x": 1400, "y": 300}])
check:
  - len(tl.clip("c1.rocket").get("keyframes")) == 2
  - tl.clip("c1.rocket").params["keyframes"][1]["x"] == 233  # stored on the 320-wide grid
  - tl.clip("c1.rocket").get("keyframes")[1]["x"] == 1398  # read back in canvas px, snapped to the 6-px grid
  - tl.clip("c1.rocket").get("keyframes")[0]["x"] == 1002
