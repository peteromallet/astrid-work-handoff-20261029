id: look.fade-in.card-8f-ease-out
source: new
intent: Fade the c2 card title in over 8 frames with an ease-out (the clip-level entrance, eased; not an element param).
fixture: tiny
expect: change
cli: edit --clip c2.card --fade-in 8f ease=out
sheet:
  cuts: [c2]
  replace:
    - ["for 1s", "for 1s fade_in=\"8f ease=out\""]
python: |
  tl.clip("c2.card").look.set(fade_in="8f ease=out")
check:
  - 'tl.clip("c2.card").data.get("entrance") == {"type": "fade", "duration": 0.2667, "params": {"easing": "out"}}'
