id: look.set.plate-zoom-fraction
source: "h2 L11 (V-1: zoom is an integer 1-3)"
intent: A fractional zoom (1.2) on the c1 plate is refused on every path, because am-snap-plate zoom is an integer 1-3 by its element.yaml.
fixture: tiny
expect: refused
cli: edit --clip c1.plate --set zoom=1.2
sheet:
  cuts: [c1]
  replace:
    - ["snap-plate  P", "snap-plate  P zoom=1.2"]
python: |
  tl.clip("c1.plate").set(zoom=1.2)
