id: look.remove.card
source: h2 L7
intent: Remove the c2 "Live." card; the c2 plate stays and the film length is unchanged.
fixture: tiny
expect: change
cli: edit --clip c2.card --remove
sheet:
  cuts: [c2]
  replace:
    - ["         type   card   type        \"Live.\"  for 1s\n", ""]
python: |
  tl.clip("c2.card").remove()
check:
  - len(tl.clips(text="Live.")) == 0
  - tl.clip("c2.plate") is not None
  - abs(tl.duration - 8.0) < 1e-6
