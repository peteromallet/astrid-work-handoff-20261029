id: look.set.rocket-enter
source: h2 L10
intent: Give the c1 rocket the stamp entrance (enter=stamp), instead of its default.
fixture: tiny
expect: change
cli: edit --clip c1.rocket --set enter=stamp
sheet:
  cuts: [c1]
  replace:
    - ["x=60", "x=60 enter=stamp"]
python: |
  tl.clip("c1.rocket").set(enter="stamp")
check:
  - tl.clip("c1.rocket").get("enter") == "stamp"
