id: look.swap-asset.rocket
source: h2 L4
intent: Show asset P instead of R on the c1 rocket, keeping its timing and position.
fixture: tiny
expect: change
idempotent: true
cli: edit --clip c1.rocket --swap-asset P
sheet:
  cuts: [c1]
  replace:
    - ["sprite      R  on", "sprite      P  on"]
python: |
  tl.clip("c1.rocket").swap_asset("P")
check:
  - tl.clip("c1.rocket").asset == "P"
  - abs(tl.clip("c1.rocket").start - 1.3) < 1e-3
