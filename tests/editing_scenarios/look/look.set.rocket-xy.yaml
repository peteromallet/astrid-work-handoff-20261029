id: look.set.rocket-xy
source: h2 L2
intent: Move the c1 rocket to x=180, y=300 (canvas px) in one edit.
fixture: tiny
expect: change
cli: edit --clip c1.rocket --set x=180 --set y=300
sheet:
  cuts: [c1]
  replace:
    - ["x=60", "x=180 y=300"]
python: |
  tl.clip("c1.rocket").set(x=180, y=300)
check:
  - tl.clip("c1.rocket").get("x") == 180
  - tl.clip("c1.rocket").get("y") == 300
