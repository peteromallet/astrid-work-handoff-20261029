id: look.set.card-text
source: h2 L1
intent: Make the c2 card say "Now live." instead of "Live.".
fixture: tiny
expect: change
idempotent: true
cli: edit --clip c2.card --set 'text="Now live."'
sheet:
  cuts: [c2]
  replace:
    - ['"Live."', '"Now live."']
python: |
  tl.clip("c2.card").set(text="Now live.")
check:
  - tl.clip("c2.card").get("text") == "Now live."
