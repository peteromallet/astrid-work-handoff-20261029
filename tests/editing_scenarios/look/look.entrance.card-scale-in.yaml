id: look.entrance.card-scale-in
source: new
intent: Give the c2 card a scale-in entrance over 18 frames (0.6 s).
fixture: tiny
expect: change
cli: edit --clip c2.card --entrance scale-in 18f
sheet:
  cuts: [c2]
  replace:
    - ["for 1s", "for 1s entrance=\"scale-in 18f\""]
python: |
  tl.clip("c2.card").look.set(entrance="scale-in 18f")
check:
  - 'tl.clip("c2.card").data.get("entrance") == {"type": "scale-in", "duration": 0.6}'
