id: look.look.rocket-opacity
source: new
intent: Set the c1 rocket to 60 percent opacity; the clip-level look must show as a change in the diff, status and the change list.
fixture: tiny_publishable    # tiny.json has no pinned base, so no edit shows as a change there
expect: change
cli: edit --clip c1.rocket --opacity 0.6
sheet:
  cuts: [c1]
  replace:
    - ["x=60", "x=60 opacity=0.6"]
python: |
  tl.clip("c1.rocket").look.set(opacity=0.6)
check:
  - 'tl.clip("c1.rocket").data.get("opacity") == 0.6'
  - 'any("opacity" in line for line in tl.changes())'
  - 'tl.edits()["changes"]'
