id: look.set.rocket-x
source: h2 L2
intent: Move the rocket to x=120 (canvas px).
fixture: tiny
expect: change
idempotent: true
cli: edit --clip c1.rocket --set x=120
sheet:
  cuts: [c1]
  replace:
    - ["x=60", "x=120"]
python: |
  tl.clip("c1.rocket").set(x=120)
check:
  - tl.clip("c1.rocket").get("x") == 120
