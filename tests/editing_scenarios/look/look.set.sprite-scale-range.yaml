id: look.set.sprite-scale-range
source: "Round 0 L1-01: scale is an integer 1-24 on am-sprite"
intent: An am-sprite scale above its schema maximum (scale=30 on the c1 rocket, max 24) is refused on every path.
fixture: tiny
expect: refused
cli: edit --clip c1.rocket --set scale=30
sheet:
  cuts: [c1]
  replace:
    - ["x=60", "x=60 scale=30"]
python: |
  tl.clip("c1.rocket").set(scale=30)
