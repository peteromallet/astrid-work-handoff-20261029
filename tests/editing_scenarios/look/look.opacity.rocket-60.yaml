id: look.opacity.rocket-60
source: new
intent: Set the c1 rocket to 60 percent opacity (the clip-level opacity, rendered from composition 0.0.7).
fixture: tiny
expect: change
cli: edit --clip c1.rocket --opacity 0.6
sheet:
  cuts: [c1]
  replace:
    - ["x=60", "x=60 opacity=0.6"]
python: |
  tl.clip("c1.rocket").look.set(opacity=0.6)
check:
  - 'tl.clip("c1.rocket").data.get("opacity") == 0.6'
