         Every boot animation is transform or opacity (the body wipe moves a masked layer and
         counter-moves its content), so the compositor keeps it moving on a busy main thread.
         Out, with a logo to land on (.boot-flying): the mink runs home to the header logo
         (600ms), slowing to a stop, while its body dissolves from the bottom up so only its
         head arrives, on the logo's head; then the two trade places (180ms). The paper
         dissolves meanwhile (360ms).

         data-boot-mink-continue): the panel's mink takes over this one's stride and the layer is

      // Vite strips attributes (an id) from the built entry tag, so match it by being the module script.
      // Resource load errors do not bubble, hence the capture phase.
      window.addEventListener('error', function (event) {
        var target = event.target;
        if (!target || target.tagName !== 'SCRIPT' || target.type !== 'module') return;
        var root = document.getElementById('root');
        var boot = document.getElementById('boot');
        if (boot) boot.remove();
        var message = document.createElement('main');
        var content = document.createElement('div');
        var icon = document.createElement('img');
        var title = document.createElement('h1');
        var detail = document.createElement('p');
        var link = document.createElement('a');
        // Shown before the app's CSS loads: keep in step with showFailureCard in src/app/main.tsx
        message.setAttribute('role', 'alert');
        message.style.cssText = 'min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;text-align:center;color:var(--boot-ink,#2b2724);font-family:Inter,system-ui,-apple-system,sans-serif';
        content.style.maxWidth = '420px';
        icon.src = '/astrid-app-icon-192.png';
        icon.alt = '';
        icon.width = 76;
        icon.height = 76;
        icon.style.cssText = 'display:block;margin:0 auto';
        title.textContent = 'Astrid could not load';
        title.style.cssText = "margin:10px 0 4px;font:400 25px/1.2 Georgia,'Times New Roman',serif";
        detail.textContent = 'Check your connection, then reload.';
        detail.style.cssText = 'margin:0 0 16px;font-size:14px;line-height:24px;opacity:.72';
        link.textContent = 'Reload';
        link.href = window.location.href;
        link.style.cssText = 'display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 28px;border-radius:12px;background:var(--boot-ink,#2b2724);color:var(--boot-background,#faf8f5);font-size:14px;font-weight:500;text-decoration:none';
        content.append(icon, title, detail, link);
        message.append(content);
        root.replaceChildren(message);
      }, true);

      if ('serviceWorker' in navigator) {
        var appWorkerUrl = new URL('/sw.js', window.location.href).href;
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          return Promise.all(registrations.filter(function (registration) {
            return [registration.active, registration.waiting, registration.installing]
              .some(function (worker) { return worker && worker.scriptURL === appWorkerUrl; });
          }).map(function (registration) { return registration.unregister(); }));
        }).catch(function () {});
      }
      if ('caches' in window) {
        caches.keys().then(function (names) {
          return Promise.all(names.filter(function (name) { return name.indexOf('astrid-') === 0; })
            .map(function (name) { return caches.delete(name); }));
        }).catch(function () {});
      }
    </script>
  </body>
</html>
