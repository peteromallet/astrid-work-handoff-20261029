name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    env:
      ASTRID_CHECKOUT: ${{ github.workspace }}/astrid-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # This pin records the Astrid revision against which Runtime's integration lane is verified.
      - name: Read verified Astrid revision
        id: astrid-pin
        run: echo "sha=$(cat tests/astrid-agent.pin)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-agent
          ref: ${{ steps.astrid-pin.outputs.sha }}
          path: astrid-agent
      - name: Install system media tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: python -m pip install -e '.[test]'
      - run: python -m pip install -e "$ASTRID_CHECKOUT"
      - run: python -m pytest -q -m integration
