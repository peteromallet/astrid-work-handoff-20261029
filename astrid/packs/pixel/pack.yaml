{
  "schema_version": 3,
  "id": "pixel",
  "name": "Pixel",
  "version": "1.1.0",
  "status": "active",
  "domain": "media",
  "stability": "experimental",
  "support": "core",
  "visibility": "visible",
  "description": "True pixel-art tools for generated images, including safe lattice snapping, hard-alpha cutout, and sheet-to-sprites conversion. Joins ordered cutout poses into an am-sprite-compatible horizontal strip.",
  "keywords": [
    "pixel",
    "pixel-art",
    "sprite",
    "grid",
    "palette",
    "quantize",
    "background-removal",
    "cutout",
    "transparency",
    "chroma-key",
    "alpha",
    "codex",
    "gpt-image",
    "sheet",
    "sprite-strip",
    "frames"
  ],
  "capabilities": [
    "sprites",
    "cutout",
    "snap",
    "strip"
  ],
  "permissions": [
    {
      "id": "project_files",
      "reason": "Reads managed frame images and writes native, preview, cutout, strip, metadata and report outputs."
    }
  ],
  "documentation": {
    "kind": "skill",
    "path": "docs/SKILL.md"
  },
  "agent": {
    "purpose": "Use to turn a generated sheet or image into true pixel art at its drawn density, then make film-ready RGBA sprites (or hard-alpha cutouts and am-sprite strips).",
    "do_not_use_for": "Generating new images (use the generation pack), upscaling with smoothing (generation.generate_image_upscale smooths edges), or editing timelines and video.",
    "normal_entrypoints": [
      "pixel.sprites",
      "pixel.snap",
      "pixel.cutout",
      "pixel.strip"
    ]
  },
  "dependencies": {
    "python_requirements": [
      "numpy",
      "Pillow"
    ]
  },
  "actions": {
    "sprites": {
      "name": "Pixel Sprites",
      "version": "1.0.0",
      "short_description": "Turn one generated sheet into individually trimmed, native RGBA sprites.",
      "description": "Detect a square drawn lattice (or accept block), snap at that density, remove a flat, chroma, or light background, split connected pieces or regular cells, and publish each native sprite plus an indexed contact sheet and report.",
      "keywords": [
        "pixel",
        "pixel-art",
        "sprite",
        "sheet",
        "split",
        "cutout",
        "lattice"
      ],
      "invocation": {
        "kind": "command",
        "command": {
          "argv": [
            "{python_exec}",
            "-m",
            "astrid.packs.pixel.actions.sprites.run",
            "--image",
            "{image}",
            "--out",
            "{out}",
            "--mode",
            "{mode}",
            "--key",
            "{key}",
            "--tolerance",
            "{tolerance}",
            "--holes",
            "{holes}",
            "--merge-distance",
            "{merge_distance}",
            "--padding",
            "{padding}",
            "--scale",
            "{scale}"
          ],
          "input_args": [
            {
              "input": "block",
              "flag": "--block",
              "optional": true
            },
            {
              "input": "cells",
              "flag": "--cells",
              "optional": true
            }
          ]
        }
      },
      "inputs": [
        {
          "name": "image",
          "type": "file",
          "required": true,
          "artifact_type": "image",
          "description": "Managed generation or media image handle."
        },
        {
          "name": "mode",
          "type": "string",
          "required": false,
          "default": "chroma",
          "description": "Background removal mode (chroma, flat, luma)."
        },
        {
          "name": "key",
          "type": "string",
          "required": false,
          "default": "#FF00FF",
          "description": "Chroma key colour."
        },
        {
          "name": "tolerance",
          "type": "integer",
          "required": false,
          "default": 48,
          "description": "Background colour distance threshold."
        },
        {
          "name": "holes",
          "type": "boolean",
          "required": false,
          "default": true,
          "description": "Also remove enclosed key-coloured pixels."
        },
        {
          "name": "block",
          "type": "number",
          "required": false,
          "description": "Drawn square cell size in source pixels; omit for detection."
        },
        {
          "name": "cells",
          "type": "string",
          "required": false,
          "description": "Regular sheet division such as 4x2; omit for connected components."
        },
        {
          "name": "merge_distance",
          "type": "integer",
          "required": false,
          "default": 3,
          "description": "Maximum native-cell gap for detached details to join a piece."
        },
        {
          "name": "padding",
          "type": "integer",
          "required": false,
          "default": 2,
          "description": "Transparent native cells around each trimmed sprite."
        },
        {
          "name": "scale",
          "type": "integer",
          "required": false,
          "default": 8,
          "description": "Preview magnification and on-screen size reported for one timeline scale."
        }
      ],
      "outputs": [
        {
          "name": "sprites",
          "type": "file",
          "path_template": "{out}/images",
          "artifact_type": "image",
          "description": "Ordered native RGBA sprites, one managed output row per piece."
        },
        {
          "name": "preview",
          "type": "file",
          "path_template": "{out}/preview.png",
          "artifact_type": "image",
          "description": "Indexed contact sheet at scale with nearest-neighbour pixels."
        },
        {
          "name": "report",
          "type": "file",
          "path_template": "{out}/report.json",
          "description": "Lattice, source boxes, sizes, and outline-integrity measurements."
        }
      ],
      "cache": {
        "mode": "none"
      },
      "isolation": {
        "mode": "subprocess",
        "network": false
      },
      "metadata": {
        "runtime_entrypoint": "main",
        "runtime_file": "actions/sprites/run.py",
        "runtime_module": "astrid.packs.pixel.actions.sprites.run",
        "output_result_manifest": true
      },
      "resources": [
        {
          "kind": "implementation",
          "path": "actions/sprites/run.py"
        },
        {
          "kind": "implementation",
          "path": "actions/_common.py"
        },
        {
          "kind": "documentation",
          "path": "actions/sprites/STAGE.md"
        }
      ]
    },
    "cutout": {
      "name": "Pixel Cutout",
      "version": "1.1.0",
      "short_description": "Remove a flat, chroma-key, or light background into hard-alpha RGBA, optionally on the snapped pixel grid.",
      "description": "Crops (optional), optionally snaps to a logical grid first (grid=auto or WxH), then removes the background: chroma (key colour, default magenta), flat (dominant border colour), or luma (light backdrop). Background connected to the border is removed; holes=true also removes enclosed key colour. The dark outline survives. Alpha is strictly 0 or 255. Optionally trims to the alpha bounding box with padding and drops small detached specks. Outputs an RGBA PNG and a JSON report.",
      "keywords": [
        "pixel",
        "pixel-art",
        "cutout",
        "transparency",
        "chroma-key",
        "background-removal",
        "alpha",
        "sprite"
      ],
      "invocation": {
        "kind": "command",
        "command": {
          "argv": [
            "{python_exec}",
            "-m",
            "astrid.packs.pixel.actions.cutout.run",
            "--image",
            "{image}",
            "--out",
            "{out}",
            "--mode",
            "{mode}",
            "--key",
            "{key}",
            "--tolerance",
            "{tolerance}",
            "--fit",
            "{fit}",
            "--trim",
            "{trim}",
            "--trim-padding",
            "{trim_padding}",
            "--keep-largest",
            "{keep_largest}",
            "--holes",
            "{holes}",
            "--allow-lossy",
            "{allow_lossy}"
          ],
          "input_args": [
            {
              "input": "crop",
              "flag": "--crop",
              "optional": true
            },
            {
              "input": "grid",
              "flag": "--grid",
              "optional": true
            }
          ]
        }
      },
      "inputs": [
        {
          "name": "image",
          "type": "file",
          "required": true,
          "artifact_type": "image",
          "description": "Managed image descriptor {digest, filename, media_type, size_bytes} from python -m astrid media import."
        },
        {
          "name": "crop",
          "type": "string",
          "required": false,
          "description": "Optional JSON-encoded {x, y, width, height} in source pixels, applied before anything else."
        },
        {
          "name": "mode",
          "type": "string",
          "required": false,
          "default": "chroma",
          "description": "chroma (key colour), flat (auto-detected border colour), or luma (light backdrop)."
        },
        {
          "name": "key",
          "type": "string",
          "required": false,
          "default": "#FF00FF",
          "description": "Key colour for chroma mode."
        },
        {
          "name": "tolerance",
          "type": "integer",
          "required": false,
          "default": 48,
          "description": "RGB distance (0-255) from the key or border colour that counts as background."
        },
        {
          "name": "grid",
          "type": "string",
          "required": false,
          "description": "auto to detect the pixel lattice, or WIDTHxHEIGHT to snap first; omit to cut at full resolution."
        },
        {
          "name": "fit",
          "type": "string",
          "required": false,
          "default": "contain",
          "description": "Fit used with an explicit grid (cover, contain or none). contain keeps the whole subject."
        },
        {
          "name": "trim",
          "type": "boolean",
          "required": false,
          "default": true,
          "description": "Crop to the alpha bounding box."
        },
        {
          "name": "trim_padding",
          "type": "integer",
          "required": false,
          "default": 2,
          "description": "Padding in output pixels around the trimmed bounding box."
        },
        {
          "name": "keep_largest",
          "type": "boolean",
          "required": false,
          "default": true,
          "description": "Drop detached specks smaller than 5% of the largest foreground component."
        },
        {
          "name": "holes",
          "type": "boolean",
          "required": false,
          "default": false,
          "description": "Also remove key-coloured pixels enclosed by the sprite (gaps between legs, chain links). For chroma keys that never occur in the art."
        },
        {
          "name": "allow_lossy",
          "type": "boolean",
          "required": false,
          "default": false,
          "description": "Override the guard against a coarse explicit grid when grid is WIDTHxHEIGHT."
        }
      ],
      "outputs": [
        {
          "name": "cutout",
          "type": "file",
          "path_template": "{out}/cutout.png",
          "artifact_type": "image",
          "description": "RGBA PNG with hard alpha."
        },
        {
          "name": "report",
          "type": "file",
          "path_template": "{out}/report.json",
          "description": "Background key, bounding box, grid used, and speck statistics."
        }
      ],
      "cache": {
        "mode": "none"
      },
      "isolation": {
        "mode": "subprocess",
        "network": false
      },
      "metadata": {
        "runtime_entrypoint": "main",
        "runtime_file": "actions/cutout/run.py",
        "runtime_module": "astrid.packs.pixel.actions.cutout.run",
        "output_result_manifest": true
      },
      "resources": [
        {
          "kind": "implementation",
          "path": "actions/cutout/run.py"
        },
        {
          "kind": "implementation",
          "path": "actions/_common.py"
        },
        {
          "kind": "documentation",
          "path": "actions/cutout/STAGE.md"
        }
      ]
    },
    "snap": {
      "name": "Pixel Snap",
      "version": "1.1.0",
      "short_description": "Snap a generated image onto a logical pixel grid with mode downsampling, optional palette, and a scaled preview.",
      "description": "Crops (optional), then downsamples a managed image onto a logical pixel grid by taking each cell's modal colour, so 1 px outlines survive. The grid is either explicit (grid_width x grid_height, with fit cover/contain/none) or detected from the image's own pixel lattice (auto_grid). Optional palette (hex list or the astrid preset) or max_colors quantisation, then a nearest-neighbour preview. Outputs a grid-size native PNG, a scaled preview PNG, and a JSON report.",
      "keywords": [
        "pixel",
        "pixel-art",
        "grid",
        "palette",
        "quantize",
        "snap",
        "sprite",
        "downsample"
      ],
      "invocation": {
        "kind": "command",
        "command": {
          "argv": [
            "{python_exec}",
            "-m",
            "astrid.packs.pixel.actions.snap.run",
            "--image",
            "{image}",
            "--out",
            "{out}",
            "--auto-grid",
            "{auto_grid}",
            "--grid-width",
            "{grid_width}",
            "--grid-height",
            "{grid_height}",
            "--fit",
            "{fit}",
            "--scale",
            "{scale}",
            "--dither",
            "{dither}",
            "--allow-lossy",
            "{allow_lossy}"
          ],
          "input_args": [
            {
              "input": "crop",
              "flag": "--crop",
              "optional": true
            },
            {
              "input": "palette",
              "flag": "--palette",
              "optional": true,
              "repeatable": true
            },
            {
              "input": "max_colors",
              "flag": "--max-colors",
              "optional": true
            }
          ]
        }
      },
      "inputs": [
        {
          "name": "image",
          "type": "file",
          "required": true,
          "artifact_type": "image",
          "description": "Managed image descriptor {digest, filename, media_type, size_bytes} from python -m astrid media import."
        },
        {
          "name": "crop",
          "type": "string",
          "required": false,
          "description": "Optional JSON-encoded {x, y, width, height} in source pixels, applied before anything else."
        },
        {
          "name": "auto_grid",
          "type": "boolean",
          "required": false,
          "default": false,
          "description": "Detect the pixel-block lattice from edge periodicity instead of using grid_width/grid_height."
        },
        {
          "name": "grid_width",
          "type": "integer",
          "required": false,
          "default": 320,
          "description": "Logical grid width in cells (explicit grid only)."
        },
        {
          "name": "grid_height",
          "type": "integer",
          "required": false,
          "default": 180,
          "description": "Logical grid height in cells (explicit grid only)."
        },
        {
          "name": "fit",
          "type": "string",
          "required": false,
          "default": "cover",
          "description": "cover crops to the grid aspect, contain pads to it, none stretches the source."
        },
        {
          "name": "palette",
          "type": "string",
          "required": false,
          "description": "Preset name (astrid), comma-separated hex colours, or a list of hex colours to map cells onto."
        },
        {
          "name": "max_colors",
          "type": "integer",
          "required": false,
          "description": "Quantise to this many colours (2-256) when no palette is given."
        },
        {
          "name": "scale",
          "type": "integer",
          "required": false,
          "default": 6,
          "description": "Integer nearest-neighbour factor for the preview output."
        },
        {
          "name": "dither",
          "type": "boolean",
          "required": false,
          "default": false,
          "description": "Floyd-Steinberg dithering when a palette or max_colors is applied."
        },
        {
          "name": "allow_lossy",
          "type": "boolean",
          "required": false,
          "default": false,
          "description": "Override refusal when the explicit grid is over 20 percent coarser than the drawn lattice."
        }
      ],
      "outputs": [
        {
          "name": "native",
          "type": "file",
          "path_template": "{out}/native.png",
          "artifact_type": "image",
          "description": "Grid-size RGBA PNG with hard alpha (the true pixel art)."
        },
        {
          "name": "preview",
          "type": "file",
          "path_template": "{out}/preview.png",
          "artifact_type": "image",
          "description": "Native grid scaled by an integer factor with nearest-neighbour sampling."
        },
        {
          "name": "report",
          "type": "file",
          "path_template": "{out}/report.json",
          "description": "Detected grid, colours used, and palette distance statistics."
        }
      ],
      "cache": {
        "mode": "none"
      },
      "isolation": {
        "mode": "subprocess",
        "network": false
      },
      "metadata": {
        "runtime_entrypoint": "main",
        "runtime_file": "actions/snap/run.py",
        "runtime_module": "astrid.packs.pixel.actions.snap.run",
        "output_result_manifest": true
      },
      "resources": [
        {
          "kind": "implementation",
          "path": "actions/snap/run.py"
        },
        {
          "kind": "implementation",
          "path": "actions/_common.py"
        },
        {
          "kind": "documentation",
          "path": "actions/snap/STAGE.md"
        }
      ]
    },
    "strip": {
      "name": "Pixel Sprite Strip",
      "version": "1.1.0",
      "short_description": "Join ordered pixel-art frames into one shared-grid horizontal sprite strip.",
      "description": "Aligns trimmed frames onto a common transparent cell, snaps every frame to the same logical grid and palette, then joins them left to right. Metadata includes the frame block consumed by am-sprite.",
      "keywords": [
        "pixel",
        "sprite",
        "strip",
        "animation",
        "am-sprite"
      ],
      "invocation": {
        "kind": "command",
        "command": {
          "argv": [
            "{python_exec}",
            "-m",
            "astrid.packs.pixel.actions.strip.run",
            "--out",
            "{out}",
            "--grid-width",
            "{grid_width}",
            "--grid-height",
            "{grid_height}",
            "--fit",
            "{fit}",
            "--fps",
            "{fps}",
            "--align",
            "{align}",
            "--allow-lossy",
            "{allow_lossy}"
          ],
          "input_args": [
            {
              "input": "frame",
              "flag": "--frame",
              "optional": false,
              "repeatable": true
            },
            {
              "input": "palette",
              "flag": "--palette",
              "optional": true,
              "repeatable": true
            },
            {
              "input": "max_colors",
              "flag": "--max-colors",
              "optional": true
            }
          ]
        }
      },
      "inputs": [
        {
          "name": "frame",
          "type": "file",
          "required": true,
          "artifact_type": "image",
          "description": "Ordered image handles, at least two; playback follows list order."
        },
        {
          "name": "grid_width",
          "type": "integer",
          "required": false,
          "default": 0,
          "description": "Shared grid width. 0 uses aligned frame width; set with grid_height."
        },
        {
          "name": "grid_height",
          "type": "integer",
          "required": false,
          "default": 0,
          "description": "Shared grid height. 0 uses aligned frame height; set with grid_width."
        },
        {
          "name": "fit",
          "type": "string",
          "required": false,
          "default": "cover",
          "description": "How each frame fits an explicit grid: cover, contain or none."
        },
        {
          "name": "palette",
          "type": "string",
          "required": false,
          "description": "One palette for every frame: astrid, comma-separated hex colours, or repeated hex values."
        },
        {
          "name": "max_colors",
          "type": "integer",
          "required": false,
          "default": 0,
          "description": "Quantise all frames to 2\u2013256 colours when no palette is given; 0 disables it."
        },
        {
          "name": "fps",
          "type": "number",
          "required": false,
          "default": 8,
          "description": "Playback rate stored for am-sprite."
        },
        {
          "name": "align",
          "type": "string",
          "required": false,
          "default": "bottom",
          "description": "Pad trimmed frames to a common cell, centered horizontally and anchored bottom, center or top."
        },
        {
          "name": "allow_lossy",
          "type": "boolean",
          "required": false,
          "default": false,
          "description": "Override the guard against an explicit grid over 20 percent coarser than the drawn lattice."
        }
      ],
      "outputs": [
        {
          "name": "strip",
          "type": "file",
          "path_template": "{out}/strip.png",
          "artifact_type": "image",
          "description": "Horizontal RGBA sprite strip, frames left to right."
        },
        {
          "name": "metadata",
          "type": "file",
          "path_template": "{out}/strip.json",
          "description": "Frame dimensions, count, fps and am_sprite_frames metadata."
        }
      ],
      "cache": {
        "mode": "none"
      },
      "isolation": {
        "mode": "subprocess",
        "network": false
      },
      "metadata": {
        "runtime_entrypoint": "main",
        "runtime_file": "actions/strip/run.py",
        "runtime_module": "astrid.packs.pixel.actions.strip.run",
        "output_result_manifest": true
      },
      "resources": [
        {
          "kind": "implementation",
          "path": "actions/strip/run.py"
        },
        {
          "kind": "implementation",
          "path": "actions/_common.py"
        },
        {
          "kind": "documentation",
          "path": "docs/SKILL.md"
        }
      ]
    }
  }
}
