schema_version: 3
id: capture
name: Astrid Capture
version: 1.0.0
status: active
domain: media
stability: experimental
support: core
visibility: visible
permissions:
  - id: subprocess
    reason: Starts one host-custodied headless Chromium process and drives its DevTools pipe.
  - id: network
    reason: Loads only the caller's admitted HTTPS origin through the host-managed broker; redirects are refused.
  - id: project_files
    reason: Writes the managed screenshot, provenance receipt, and result manifest.
  - id: environment
    reason: Reads the host-provisioned Remotion project and optional explicit browser path.
description: Captures an admitted HTTPS web page as a PNG with viewport options and a host-verifiable provenance receipt.
keywords:
  - capture
  - screenshot
  - web
  - page
  - browser
  - chromium
  - provenance
  - receipt
capabilities:
  - capture_web_page
agent:
  purpose: "Use to capture a real HTTPS web page as managed visual evidence with viewport/full-page/clip/dark-mode options and provenance of the admitted origin."
  do_not_use_for: "Do not use for mocking a UI, bypassing a login or bot wall, downloading files, or launching an unmanaged browser."
  normal_entrypoints:
    - capture.web_page
documentation:
  kind: skill
  path: docs/SKILL.md
actions:
  web_page:
    name: Capture Web Page
    version: 1.0.0
    short_description: Capture one admitted HTTPS web page to PNG with a provenance receipt.
    description: Opens the caller's admitted HTTPS origin in the provisioned Remotion Chromium, refuses cross-origin redirects at the host broker, and writes a PNG plus provenance receipt.
    keywords: [capture, screenshot, web-page, browser, receipt, provenance]
    invocation:
      kind: command
      command:
        argv:
          - "{python_exec}"
          - "-m"
          - astrid.packs.capture.actions.web_page.run
          - --url
          - "{url}"
          - --out
          - "{out}"
          - --viewport
          - "{viewport}"
          - --device-scale
          - "{device_scale}"
          - --full-page
          - "{full_page}"
          - --wait-ms
          - "{wait_ms}"
          - --dark-mode
          - "{dark_mode}"
        input_args:
          - input: clip
            flag: --clip
            optional: true
    inputs:
      - name: url
        type: string
        required: true
        description: HTTPS URL to capture. Credentials and other schemes are refused.
      - name: viewport
        type: string
        required: false
        default: 1600x1000
        description: CSS viewport WIDTHxHEIGHT.
      - name: device_scale
        type: integer
        required: false
        default: 2
        description: Device scale factor from 1 through 3.
      - name: full_page
        type: boolean
        required: false
        default: false
        description: Capture the whole scrollable document.
      - name: wait_ms
        type: integer
        required: false
        default: 1500
        description: Settle time after load in milliseconds, from 0 through 30000.
      - name: clip
        type: json
        required: false
        description: Optional CSS-pixel object {x,y,w,h}; takes precedence over full_page.
      - name: dark_mode
        type: boolean
        required: false
        default: false
        description: Emulate prefers-color-scheme dark.
    outputs:
      - name: screenshot
        type: file
        path_template: "{out}/screenshot.png"
        artifact_type: image/png
        description: PNG of the admitted page or requested region.
      - name: receipt
        type: file
        path_template: "{out}/receipt.json"
        artifact_type: capture/provenance
        description: URL, final URL, title, UTC time, viewport, status, browser, and broker-evidence reference.
    resources:
      - kind: implementation
        path: actions/web_page/__init__.py
      - kind: implementation
        path: actions/web_page/run.py
      - kind: documentation
        path: actions/web_page/STAGE.md
    cache:
      mode: none
    isolation:
      mode: subprocess
      network: true
      env_passthrough:
        - ASTRID_CAPTURE_CHROME
    metadata:
      runtime_entrypoint: main
      runtime_file: actions/web_page/run.py
      runtime_module: astrid.packs.capture.actions.web_page.run
      output_result_manifest: true
      requires_remotion: true
      network_policy:
        allowed_protocols: [dns, tcp]
        allowed_destinations: []
        dynamic_url_inputs: [url]
        allow_redirects: false
        broker:
          host_managed: true
          kind: broker
          enforced: true
          observable: true
          route: declared-http-routes
          wrapper: astrid-generic-host
        descendant_enforcement:
          kind: broker
          validated: true
          observable: true
          route: declared-http-routes
          wrapper: astrid-generic-host
resources:
  - kind: documentation
    path: docs/SKILL.md
